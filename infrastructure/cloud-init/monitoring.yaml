#cloud-config
# Nodo monitoring: Prometheus * Grafana * Loki * Alertmanager
# Tutti i config file vengono scritti da cloud-init al primo boot.
# I valori delle variabili ($${...}) vengono iniettati da Terraform templatefile().
package_update: true
package_upgrade: false

packages:
  - nginx

bootcmd:
  # Crea le directory prima di write_files (che le richiede gia esistenti)
  - mkdir -p /opt/monitoring/prometheus/rules
  - mkdir -p /opt/monitoring/loki
  - mkdir -p /opt/monitoring/alertmanager
  - mkdir -p /opt/monitoring/grafana/provisioning/datasources
  - mkdir -p /opt/monitoring/grafana/provisioning/dashboards
  - mkdir -p /opt/monitoring/mysqld_exporter

write_files:
  # -- .env (segreti, mode 600) ----------------------------------------------
  - path: /opt/monitoring/.env
    permissions: "0600"
    owner: root:root
    content: |
      GRAFANA_PASSWORD=${grafana_password}
      VALKEY_EXPORTER_URI=${valkey_exporter_uri}
      ALERTMANAGER_SLACK_URL=${alertmanager_slack_url}
      ALERTMANAGER_SLACK_CHANNEL=${alertmanager_slack_channel}

  # -- mysqld_exporter .my.cnf (mode 644 so nobody user inside container can read)
  - path: /opt/monitoring/mysqld_exporter/.my.cnf
    permissions: "0644"
    owner: root:root
    content: |
      [client]
      user=${mysql_exporter_user}
      password=${mysql_exporter_password}
      host=${mysql_exporter_host}
      port=${mysql_exporter_port}
      ssl-mode=REQUIRED

  # -- docker-compose.yml ---------------------------------------------------
  - path: /opt/monitoring/docker-compose.yml
    content: |
      services:
        prometheus:
          image: prom/prometheus:latest
          volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./prometheus/rules:/etc/prometheus/rules:ro
            - prometheus_data:/prometheus
          command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.retention.time=30d'
            - '--web.enable-lifecycle'
          restart: unless-stopped

        alertmanager:
          image: prom/alertmanager:latest
          volumes:
            - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
          command:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
          restart: unless-stopped

        loki:
          image: grafana/loki:latest
          volumes:
            - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
            - loki_data:/loki
          command: -config.file=/etc/loki/local-config.yaml
          ports:
            - "3100:3100"
          restart: unless-stopped

        blackbox:
          image: prom/blackbox-exporter:latest
          restart: unless-stopped

        mysqld_exporter:
          image: prom/mysqld-exporter:latest
          volumes:
            - ./mysqld_exporter/.my.cnf:/home/.my.cnf:ro
          command: ["--config.my-cnf=/home/.my.cnf"]
          restart: unless-stopped

        redis_exporter:
          image: oliver006/redis_exporter:latest
          environment:
            - REDIS_ADDR=$VALKEY_EXPORTER_URI
          restart: unless-stopped

        grafana:
          image: grafana/grafana:latest
          volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
          environment:
            - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_PASSWORD
            - GF_USERS_ALLOW_SIGN_UP=false
          ports:
            - "127.0.0.1:3000:3000"
          restart: unless-stopped

      volumes:
        prometheus_data:
        loki_data:
        grafana_data:

  # -- prometheus/prometheus.yml ---------------------------------------------
  - path: /opt/monitoring/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
        external_labels:
          environment: production

      alerting:
        alertmanagers:
          - static_configs:
              - targets: ['alertmanager:9093']

      rule_files:
        - /etc/prometheus/rules/*.yml

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ['localhost:9090']

        - job_name: node-app-1
          static_configs:
            - targets: ['${app_node_1_ip}:9100']
              labels:
                node: app-1

        - job_name: node-app-2
          static_configs:
            - targets: ['${app_node_2_ip}:9100']
              labels:
                node: app-2

        - job_name: cadvisor-app-1
          static_configs:
            - targets: ['${app_node_1_ip}:8080']
              labels:
                node: app-1

        - job_name: cadvisor-app-2
          static_configs:
            - targets: ['${app_node_2_ip}:8080']
              labels:
                node: app-2

        - job_name: mysql
          static_configs:
            - targets: ['mysqld_exporter:9104']

        - job_name: valkey
          static_configs:
            - targets: ['redis_exporter:9121']

        - job_name: blackbox-lb
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
                - http://${lb_ip}/healthz
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox:9115

  # -- prometheus/rules/infrastructure.yml -----------------------------------
  - path: /opt/monitoring/prometheus/rules/infrastructure.yml
    content: |
      groups:
        - name: host
          rules:
            - alert: HostHighCPU
              expr: 100 - (avg by(node)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: 'High CPU on {{ $labels.node }} ({{ $value | printf "%.0f" }}%)'

            - alert: HostLowDisk
              expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: 'Low disk on {{ $labels.node }}: {{ $value | printf "%.0f" }}% free'

            - alert: HostLowMemory
              expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: 'Low RAM on {{ $labels.node }}: {{ $value | printf "%.0f" }}% free'

            - alert: HostHighLoad
              expr: node_load5 > on(node) (count by(node)(node_cpu_seconds_total{mode="idle"}) * 2)
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: 'High load on {{ $labels.node }}'

        - name: containers
          rules:
            - alert: ContainerDown
              expr: time() - container_last_seen{name!=""} > 60
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: 'Container {{ $labels.name }} down on {{ $labels.node }}'

            - alert: ContainerHighMemory
              expr: |
                container_memory_usage_bytes{name!=""}
                / container_spec_memory_limit_bytes{name!=""}
                > 0.9
                and container_spec_memory_limit_bytes{name!=""} > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: 'Container {{ $labels.name }} using >90% memory limit'

            - alert: ContainerHighRestart
              expr: increase(container_restart_count{name!=""}[10m]) > 3
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: 'Container {{ $labels.name }} restarting frequently'

        - name: loadbalancer
          rules:
            - alert: LoadBalancerDown
              expr: probe_success{job="blackbox-lb"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Load balancer health check failing"

            - alert: LoadBalancerSlowResponse
              expr: probe_duration_seconds{job="blackbox-lb"} > 2
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: 'Load balancer responding slowly ({{ $value | printf "%.2f" }}s)'

        - name: managed-services
          rules:
            - alert: MySQLDown
              expr: mysql_up == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Managed MySQL is unreachable"

            - alert: ValkeyDown
              expr: redis_up == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Managed Valkey is unreachable"

            - alert: ValkeyHighMemory
              expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Valkey memory usage above 85%"

            - alert: MySQLHighConnections
              expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "MySQL connections above 80% of max"

  # -- prometheus/rules/application.yml --------------------------------------
  - path: /opt/monitoring/prometheus/rules/application.yml
    content: |
      groups:
        - name: application
          rules:
            # Uncomment once the Flask app exposes /metrics via prometheus_flask_exporter
            # - alert: HighHTTP5xxRate
            #   expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            #   for: 5m
            #   labels:
            #     severity: warning
            #   annotations:
            #     summary: 'High 5xx rate on {{ $labels.node }}'

  # -- loki/loki-config.yml --------------------------------------------------
  - path: /opt/monitoring/loki/loki-config.yml
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 720h

      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
        compaction_interval: 10m

  # -- alertmanager/alertmanager.yml -----------------------------------------
  - path: /opt/monitoring/alertmanager/alertmanager.yml
    content: |
      global:
        resolve_timeout: 5m

      route:
        group_by: ['alertname', 'node']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: 'null'
      %{~ if alertmanager_slack_url != "" }
        routes:
          - match:
              severity: critical
            receiver: slack
            continue: true
      %{~ endif }

      receivers:
        - name: 'null'
      %{~ if alertmanager_slack_url != "" }
        - name: slack
          slack_configs:
            - api_url: '${alertmanager_slack_url}'
              channel: '${alertmanager_slack_channel}'
              send_resolved: true
              title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
              text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      %{~ endif }

      inhibit_rules:
        - source_match:
            severity: critical
          target_match:
            severity: warning
          equal: ['node']

  # -- grafana/provisioning/datasources/datasources.yml ----------------------
  - path: /opt/monitoring/grafana/provisioning/datasources/datasources.yml
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus:9090
          isDefault: true
          editable: false

        - name: Loki
          type: loki
          url: http://loki:3100
          editable: false

  # -- grafana/provisioning/dashboards/dashboards.yml ------------------------
  - path: /opt/monitoring/grafana/provisioning/dashboards/dashboards.yml
    content: |
      apiVersion: 1
      providers:
        - name: default
          type: file
          disableDeletion: true
          updateIntervalSeconds: 30
          options:
            path: /etc/grafana/provisioning/dashboards

  # -- nginx: proxy HTTP -> Grafana -------------------------------------------
  - path: /etc/nginx/sites-available/grafana
    content: |
      server {
          listen 80 default_server;
          server_name _;

          location / {
              proxy_pass         http://127.0.0.1:3000;
              proxy_set_header   Host $host;
              proxy_set_header   X-Real-IP $remote_addr;
              proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
              proxy_read_timeout 300;
          }
      }

runcmd:
  - apt-get install -y docker.io docker-compose-v2
  - systemctl enable --now docker

  # Attiva il sito nginx e ricarica
  - ln -sf /etc/nginx/sites-available/grafana /etc/nginx/sites-enabled/grafana
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl reload nginx

  # Avvia lo stack monitoring
  - cd /opt/monitoring && docker compose up -d

  # Attendi che Grafana sia pronto (max 5 minuti)
  - |
    for i in $(seq 1 30); do
      curl -sf http://localhost:3000/api/health && break
      echo "Waiting for Grafana (attempt $i/30)..."
      sleep 10
    done

  # Scarica i dashboard community (JSON embedded nel provisioning)
  - |
    curl -sL "https://grafana.com/api/dashboards/1860/revisions/latest/download" \
      -o /opt/monitoring/grafana/provisioning/dashboards/node-exporter-full.json
    curl -sL "https://grafana.com/api/dashboards/893/revisions/latest/download" \
      -o /opt/monitoring/grafana/provisioning/dashboards/docker-cadvisor.json
    curl -sL "https://grafana.com/api/dashboards/13639/revisions/latest/download" \
      -o /opt/monitoring/grafana/provisioning/dashboards/loki-logs.json
