global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          node: local

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          node: local

  - job_name: app
    static_configs:
      - targets: ["app:5000"]
        labels:
          node: local

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml
