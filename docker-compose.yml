# docker-compose.yml  ─  configurazione BASE condivisa tra tutti gli ambienti
#
# NON contiene: bind mount del codice, immagine specifica, debug flags.
# Caricato automaticamente da tutti i compose command.
# Per sviluppo locale: si combina con docker-compose.override.yml (automatico).
# Per produzione:      si combina con docker-compose.prod.yml (esplicito in CI/CD).

services:
  app:
    environment:
      # Connessione MySQL: tutte le DB_* sono lette dall'ambiente del runner
      # (CI/CD esporta i valori sourced da .env.mysql + secret GitHub).
      # I default sono pensati per dev locale (mysql:8 senza TLS).
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-todos}
      DB_USER: ${DB_USER:-todoapp}
      DB_PASSWORD: ${DB_PASSWORD:-todopw}
      # In dev DB_SSL_CA="" => no TLS. In prod e' /etc/mysql-ca/mysql-ca.pem
      # (override impostato da Dockerfile/compose.prod a seconda dell'ambiente).
      DB_SSL_CA: ${DB_SSL_CA:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
