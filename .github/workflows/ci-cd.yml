# .github/workflows/ci-cd.yml
#
# Pipeline CI/CD completa per Docker.
# Trigger:
#   • Push su main/master   → lint + test + build + push immagine + deploy production
#   • Push tag stage-*      → lint + test + build + push immagine + deploy staging
#   • Pull Request su main  → lint + test (no push, no deploy)
#
# Secret necessari (configurati per environment in GitHub):
#   • DEPLOY_HOSTS    — IP pubblici dei nodi app separati da virgola (es. 1.2.3.4,5.6.7.8)
#                       Ottenibili con: terraform output app_node_ips
#   • DEPLOY_USER     — utente SSH (root per Droplet DigitalOcean di default)
#   • DEPLOY_SSH_KEY  — chiave privata SSH (PEM) per accedere ai nodi
#
# Secret MySQL (override sull'.env.mysql scritto dal cloud-init; opzionali ma
# consigliati per rotazione rapida senza re-applicare Terraform):
#   • DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
#       Sourced via: terraform output -raw mysql_<field>
#   • DB_SSL_CA       — base64 del certificato CA del cluster
#       Sourced via: terraform output -raw mysql_ca_certificate | base64

name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - "stage-*"
  pull_request:
    branches: [main, master]

# Permessi necessari per scrivere su GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/docker-todo

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — lint (fast, parallel con test)
  # Ruff (format + lint) + MyPy strict + Prettier check
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-test.txt

      - name: Install Python lint dependencies
        # mypy --strict deve poter risolvere gli import di app/ (flask,
        # flask_sqlalchemy, sqlalchemy). Installiamo tutte le dipendenze
        # runtime + i tool di lint dal requirements-test (ruff, mypy,
        # types-PyMySQL).
        run: pip install -r app/requirements.txt -r requirements-test.txt

      - name: Ruff format check
        run: ruff format --check app/

      - name: Ruff lint
        run: ruff check app/

      - name: MyPy strict
        run: mypy app/

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Prettier check
        run: >
          npx prettier --check
          "app/templates/**"
          "*.{json,yml,yaml,md}"
          ".github/**/*.{yml,yaml}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — test (parallel con lint)
  # Suite completa: unit + integration + api + e2e con coverage enforcement
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    # Service container: MySQL 8 raggiungibile su 127.0.0.1:3306.
    # I --health-* options bloccano l'avvio del job finche' il DB non e' pronto,
    # quindi pytest puo' importare app/app.py (che chiama db.create_all() a
    # module level) senza race conditions.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: todos
          MYSQL_USER: todoapp
          MYSQL_PASSWORD: todopw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run full test suite with coverage enforcement
        env:
          # Tests parlano col service container MySQL via TCP loopback.
          # DB_SSL_CA="" => no TLS (il container non espone una CA).
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: todos
          DB_USER: todoapp
          DB_PASSWORD: todopw
          DB_SSL_CA: ""
        run: pytest --cov-fail-under=100

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — build & push dell'immagine Docker
  # Gira solo su push a main (non su PR), richiede lint + test verdi.
  # ────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' # ← skip sulle PR

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Imposta QEMU per build multi-arch (arm64 + amd64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Buildx: il builder avanzato di Docker (multi-arch, cache, ecc.)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login su GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token automatico, nessun secret manuale

      # Genera tag e labels automatici:
      #   • :latest      su ogni push a main
      #   • :sha-XXXXX   sempre (primo commit SHA)
      #   • :v1.2.3      se esiste un tag Git semver
      #   • :stage-*     se esiste un tag Git con prefisso stage-
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag

      # Build multi-arch e push su GHCR
      # Il cache da/verso GHCR evita di ricompilare layer non modificati
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4a — deploy staging
  # Gira solo quando viene pushato un tag "stage-*" (da qualsiasi branch).
  # Usa l'environment "staging" → DEPLOY_HOSTS punta ai nodi di staging.
  # L'immagine viene identificata dal nome del tag (es. stage-20260430).
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/stage-')
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 1: prepare nodes (wait cloud-init, ensure Docker, ensure NFS,
      # ensure target dir). MUST run before SCP — otherwise SCP can race
      # against cloud-init still creating /root/docker-todo.
      - name: Prepare staging nodes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            echo "Waiting for cloud-init to complete..."
            cloud-init status --wait || echo "cloud-init reported errors, continuing"

            # Always ensure packages — apt is idempotent if already installed
            apt-get update -qq
            apt-get install -y docker.io docker-compose-v2 nfs-common
            systemctl enable --now docker

            # Self-heal NFS mount.
            # If cloud-init didn't write the fstab entry, reconstruct it from
            # /etc/nfs-server-ip (written by cloud-init) or NFS_SERVER_IP var.
            NFS_IP=$(cat /etc/nfs-server-ip 2>/dev/null || echo "${{ vars.NFS_SERVER_IP }}")
            if [ -z "$NFS_IP" ]; then
              echo "❌ No NFS server IP available."
              echo "Either /etc/nfs-server-ip is missing (broken cloud-init)"
              echo "or the NFS_SERVER_IP GitHub variable is unset."
              echo "Run: terraform output -raw db_private_ip"
              echo "and set it as a 'staging' environment variable in GitHub."
              exit 1
            fi
            mkdir -p /mnt/todo-data
            if ! grep -q '/mnt/todo-data' /etc/fstab; then
              echo "Reconstructing fstab entry: NFS server $NFS_IP"
              echo "$NFS_IP:/srv/todo-data /mnt/todo-data nfs defaults,_netdev,nofail 0 0" >> /etc/fstab
            fi

            if ! mountpoint -q /mnt/todo-data; then
              echo "/mnt/todo-data not mounted, retrying..."
              for i in $(seq 1 12); do
                mount /mnt/todo-data 2>/dev/null && break
                echo "  attempt $i/12: NFS mount failed, retrying in 10s..."
                sleep 10
              done
            fi
            if ! mountpoint -q /mnt/todo-data; then
              echo "❌ NFS mount failed after 2 min — aborting"
              echo "--- fstab ---"
              cat /etc/fstab
              echo "--- port 2049 reachable? ---"
              nc -zvw5 "$NFS_IP" 2049 2>&1 || true
              echo "--- showmount ---"
              showmount -e "$NFS_IP" 2>&1 || true
              echo "--- mount error ---"
              mount /mnt/todo-data 2>&1 || true
              exit 1
            fi
            # Container appuser writes /data/todos.db; permissive perms on
            # the NFS mount let the non-root UID write to the share
            chmod 777 /mnt/todo-data

            mkdir -p /root/docker-todo

      - name: Copy compose files to staging nodes
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/root/docker-todo"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # appleboy/ssh-action expone le var di environment definite qui dentro
          # allo script via la sua envs: list. Cosi' i secret DB_* arrivano
          # dentro alla shell remota senza inline ${{ secrets... }} (che si
          # espandono a stringa vuota se non settati e farebbero shadowing).
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_CA_B64: ${{ secrets.DB_SSL_CA }}
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,DB_SSL_CA_B64
          command_timeout: 10m
          script: |
            set -e
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

            cd /root/docker-todo

            # Sanity check: both compose files must be present and non-empty
            for f in docker-compose.yml docker-compose.prod.yml; do
              [ -s "$f" ] || { echo "Missing or empty: $f"; ls -la; exit 1; }
            done

            # Docker bind mounts auto-create their source as a *directory* if
            # it doesn't exist when `docker compose up` runs. A previous deploy
            # without the DB_SSL_CA secret would have left mysql-ca.pem as an
            # empty dir; clean it up so the next `>` redirect can write a file.
            if [ -d /root/docker-todo/mysql-ca.pem ]; then
              echo "Removing stray directory at /root/docker-todo/mysql-ca.pem (Docker bind-mount auto-create)"
              rm -rf /root/docker-todo/mysql-ca.pem
            fi

            # Decode the base64-encoded CA cert from secret to the host path
            # docker-compose.prod.yml bind-mounts read-only into the container.
            # Falls back to whatever cloud-init wrote if the secret isn't set
            # (additive deploy: existing droplets keep working without changes).
            if [ -n "${DB_SSL_CA_B64:-}" ]; then
              echo "$DB_SSL_CA_B64" | base64 -d > /root/docker-todo/mysql-ca.pem
              chmod 644 /root/docker-todo/mysql-ca.pem
            fi

            # Source env files written by cloud-init.
            [ -f .env.valkey ] && export $(cat .env.valkey | xargs)
            [ -f .env.mysql  ] && export $(cat .env.mysql  | xargs)

            # Workflow secrets win over .env.mysql when both are set —
            # supports rotation without rerunning Terraform/cloud-init.
            [ -n "${DB_HOST:-}" ]     && export DB_HOST
            [ -n "${DB_PORT:-}" ]     && export DB_PORT
            [ -n "${DB_NAME:-}" ]     && export DB_NAME
            [ -n "${DB_USER:-}" ]     && export DB_USER
            [ -n "${DB_PASSWORD:-}" ] && export DB_PASSWORD
            # Container-side path: docker-compose.prod.yml monta mysql-ca.pem
            # in /etc/mysql-ca/. Sovrascriviamo qualunque DB_SSL_CA presente
            # in .env.mysql per essere espliciti sul path che il container vede.
            export DB_SSL_CA=/etc/mysql-ca/mysql-ca.pem

            # Fail-fast: se DB_HOST e' ancora vuoto qui, ne' .env.mysql ne'
            # i secret hanno fornito la connection string. Senza questo check
            # il container parte, fallback a `mysql` (default del compose),
            # e sprechiamo 90s di healthcheck retry per scoprirlo.
            if [ -z "${DB_HOST:-}" ]; then
              echo "ERROR: DB_HOST is empty after sourcing .env.mysql and applying secrets."
              echo "  - .env.mysql exists?  $([ -f .env.mysql ] && echo yes || echo NO)"
              echo "  - mysql-ca.pem exists? $([ -f mysql-ca.pem ] && echo yes || echo NO)"
              echo "Set the GH secrets DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD/DB_SSL_CA"
              echo "for this environment, or recycle the app droplets so cloud-init writes"
              echo ".env.mysql. See docs/MYSQL_MIGRATION.md section 6."
              exit 1
            fi

            # Export per gli step successivi di docker compose
            export IMAGE_TAG=${{ github.ref_name }}
            export GITHUB_REPOSITORY=${{ github.repository }}

            docker pull ghcr.io/${{ github.repository }}/docker-todo:${{ github.ref_name }}
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-build
            docker image prune -f
            sleep 5
            # Pass the same -f flags here too: without them compose ps would
            # auto-discover only docker-compose.yml (base) and miss the prod
            # override that carries the image: key
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            # Retry for 90s: gunicorn workers + container healthcheck
            # start_period mean the app may not respond on the first try
            for i in $(seq 1 18); do
              if curl --fail --silent http://localhost:5001/healthz > /dev/null; then
                echo "✅ Staging deploy OK (attempt $i)"
                exit 0
              fi
              echo "  attempt $i/18: not ready yet, sleeping 5s..."
              sleep 5
            done

            # Failed — dump diagnostics so we can see what's wrong
            echo "❌ Healthcheck failed after 90s"
            echo "--- docker ps ---"
            docker ps -a
            echo "--- container logs ---"
            docker logs docker-todo-prod --tail 100 2>&1 || true
            echo "--- mount ---"
            mount | grep -E 'todo-data|nfs' || echo "(no NFS mount found)"
            exit 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4b — deploy production
  # Gira solo su push a main/master, dopo build-push riuscito.
  # DEPLOY_HOSTS: IP pubblici dei nodi (comma-separated).
  # appleboy/ssh-action li esegue in parallelo su tutti gli host.
  # ────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 1: prepare nodes (wait cloud-init, ensure Docker, ensure NFS,
      # ensure target dir). Must run before SCP to avoid race.
      - name: Prepare production nodes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            echo "Waiting for cloud-init to complete..."
            cloud-init status --wait || echo "cloud-init reported errors, continuing"

            # Always ensure packages — apt is idempotent if already installed
            apt-get update -qq
            apt-get install -y docker.io docker-compose-v2 nfs-common
            systemctl enable --now docker

            # Self-heal NFS mount (see staging deploy comment for details)
            NFS_IP=$(cat /etc/nfs-server-ip 2>/dev/null || echo "${{ vars.NFS_SERVER_IP }}")
            if [ -z "$NFS_IP" ]; then
              echo "❌ No NFS server IP available. Set NFS_SERVER_IP in GitHub vars."
              exit 1
            fi
            mkdir -p /mnt/todo-data
            if ! grep -q '/mnt/todo-data' /etc/fstab; then
              echo "$NFS_IP:/srv/todo-data /mnt/todo-data nfs defaults,_netdev,nofail 0 0" >> /etc/fstab
            fi
            if ! mountpoint -q /mnt/todo-data; then
              for i in $(seq 1 12); do
                mount /mnt/todo-data 2>/dev/null && break
                echo "  attempt $i/12: NFS mount failed, retrying in 10s..."
                sleep 10
              done
            fi
            if ! mountpoint -q /mnt/todo-data; then
              echo "❌ NFS mount failed after 2 min — aborting"
              echo "--- fstab ---"
              cat /etc/fstab
              echo "--- port 2049 reachable? ---"
              nc -zvw5 "$NFS_IP" 2049 2>&1 || true
              echo "--- showmount ---"
              showmount -e "$NFS_IP" 2>&1 || true
              echo "--- mount error ---"
              mount /mnt/todo-data 2>&1 || true
              exit 1
            fi
            chmod 777 /mnt/todo-data

            mkdir -p /root/docker-todo

      - name: Copy compose files to production nodes
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/root/docker-todo"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Vedi commento equivalente nel deploy staging.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_CA_B64: ${{ secrets.DB_SSL_CA }}
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,DB_SSL_CA_B64
          command_timeout: 10m
          script: |
            set -e
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

            cd /root/docker-todo

            # Sanity check: both compose files must be present and non-empty
            for f in docker-compose.yml docker-compose.prod.yml; do
              [ -s "$f" ] || { echo "Missing or empty: $f"; ls -la; exit 1; }
            done

            # Decode CA cert from secret to host path mounted by compose.
            # Vedi commento equivalente nel deploy staging.
            if [ -n "${DB_SSL_CA_B64:-}" ]; then
              echo "$DB_SSL_CA_B64" | base64 -d > /root/docker-todo/mysql-ca.pem
              chmod 644 /root/docker-todo/mysql-ca.pem
            fi

            # Source env files written by cloud-init (Valkey URI, MySQL conn).
            [ -f .env.valkey ] && export $(cat .env.valkey | xargs)
            [ -f .env.mysql  ] && export $(cat .env.mysql  | xargs)

            # Workflow secrets win over .env.mysql for rotation without
            # re-running Terraform/cloud-init.
            [ -n "${DB_HOST:-}" ]     && export DB_HOST
            [ -n "${DB_PORT:-}" ]     && export DB_PORT
            [ -n "${DB_NAME:-}" ]     && export DB_NAME
            [ -n "${DB_USER:-}" ]     && export DB_USER
            [ -n "${DB_PASSWORD:-}" ] && export DB_PASSWORD
            # Container-side path: vedi commento equivalente nel deploy staging.
            export DB_SSL_CA=/etc/mysql-ca/mysql-ca.pem

            # Export per gli step successivi di docker compose
            export IMAGE_TAG=latest
            export GITHUB_REPOSITORY=${{ github.repository }}

            docker pull ghcr.io/${{ github.repository }}/docker-todo:latest
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-build

            docker image prune -f
            sleep 5
            # Pass the same -f flags here too (see staging deploy comment)
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            # Retry for 90s: gunicorn workers + container healthcheck
            # start_period mean the app may not respond on the first try
            for i in $(seq 1 18); do
              if curl --fail --silent http://localhost:5001/healthz > /dev/null; then
                echo "✅ Production deploy OK (attempt $i)"
                exit 0
              fi
              echo "  attempt $i/18: not ready yet, sleeping 5s..."
              sleep 5
            done

            echo "❌ Healthcheck failed after 90s"
            echo "--- docker ps ---"
            docker ps -a
            echo "--- container logs ---"
            docker logs docker-todo-prod --tail 100 2>&1 || true
            echo "--- mount ---"
            mount | grep -E 'todo-data|nfs' || echo "(no NFS mount found)"
            exit 1
